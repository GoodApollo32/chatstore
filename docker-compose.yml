# Runs the catalog on this PC: a PostgreSQL database plus the app (search page on http://localhost:8080).
# Start/stop with the "Start Catalog" / "Stop Catalog" shortcuts; settings and keys go in the .env file.
name: chatstore

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: catalog
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog"]
      interval: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://catalog:catalog@db:5432/catalog
    # Only this PC can open the page; nobody else on the network can reach it.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Edit config/scope.json on the PC; it's picked up on the next update.
      - ./config:/app/config:ro
      - ./recordings:/app/recordings

volumes:
  dbdata:
